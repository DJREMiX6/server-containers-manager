<div class="w-full h-full flex flex-col gap-4 p-4">
  <div class="w-full h-fit flex flex-row gap-2">
    <p class="grow text-4xl">Namespaces</p>
    <p-button
      label="Create Namespace"
      severity="primary"
      size="large"
      icon="pi pi-plus"
      (onClick)="onCreateNamespaceBtnClick()"
    ></p-button>
  </div>

  <div class="w-full h-fit p-2 rounded-lg border border-surface-200">
    <p-table
      [value]="namespaceListStore.entities()"
      [loading]="namespaceListStore.loadingStatus() === 'loading'"
      [paginator]="true"
      [rows]="5"
      [rowsPerPageOptions]="[5, 10, 20]"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Showing {first} to {last} of {totalRecords} namespaces"
      sortField="name"
      [sortOrder]="1"
      class="w-full"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">
            <div class="flex items-center gap-2">
              Name
              <p-sortIcon field="name" />
            </div>
          </th>
          <th pSortableColumn="associatedUsersCount">
            <div class="flex items-center justify-center gap-2">
              Associated Users
              <p-sortIcon field="associatedUsersCount" />
            </div>
          </th>
          <th pSortableColumn="associatedContainersCount">
            <div class="flex items-center justify-center gap-2">
              Associated Containers
              <p-sortIcon field="associatedContainersCount" />
            </div>
          </th>
          <th class="w-px whitespace-nowrap">
            <div class="text-center">Actions</div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-namespace>
        <tr>
          <td>{{ namespace.name }}</td>
          <td>
            <div class="text-center">{{namespace.associatedUsersCount}}</div>
          </td>
          <td>
            <div class="text-center">
              {{namespace.associatedContainersCount}}
            </div>
          </td>
          <td class="w-px whitespace-nowrap">
            @if(!namespace.isAdmin) {
            <p-button-group>
              <p-button
                icon="pi pi-users"
                severity="primary"
                size="small"
                pTooltip="Associated Users"
                showDelay="200"
                hideDelay="100"
                tooltipPosition="top"
                (onClick)="onAssignUsersBtnClick(namespace)"
              ></p-button>
              <p-button
                icon="pi pi-th-large"
                severity="primary"
                size="small"
                pTooltip="Associated Containers"
                showDelay="200"
                hideDelay="100"
                tooltipPosition="top"
                (onClick)="onAssignContainersBtnClick(namespace)"
              ></p-button>
              <p-button
                icon="pi pi-pencil"
                severity="primary"
                size="small"
                pTooltip="Rename"
                showDelay="200"
                hideDelay="100"
                tooltipPosition="top"
              ></p-button>
              <p-button
                icon="pi pi-trash"
                severity="danger"
                size="small"
                pTooltip="Delete"
                showDelay="200"
                hideDelay="100"
                tooltipPosition="top"
              ></p-button>
            </p-button-group>
            }
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog
  header="Create namespace"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [(visible)]="isCreateNamespaceModalShown"
  (onHide)="onCreateNamespaceModalHide()"
>
  <lib-create-namespace
    #CreateNamespaceFeature
    (operationCanceled)="onCreateNamespaceOperationCanceled()"
    (operationCompleted)="onCreateNamespaceOperationCompleted()"
  ></lib-create-namespace>
</p-dialog>

<p-dialog
  header="Assign Users to {{ selectedNamespaceForUserAssignment()?.name }}"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [draggable]="false"
  [(visible)]="isNamespaceUserAssignmentModalShown"
>
  <lib-namespace-user-assignment 
  [selectedNamespaceId]="selectedNamespaceForUserAssignment()?.id"
  (operationCanceled)="onNamespaceUsersAssignmentOperationCanceled()"
  (operationCompleted)="onNamespaceUsersAssignmentOperationCompleted()"/>
</p-dialog>

<p-dialog
  header="Assign Containers to {{ selectedNamespaceForUserAssignment()?.name }}"
  [modal]="true"
  [closable]="false"
  [closeOnEscape]="false"
  [dismissableMask]="false"
  [draggable]="false"
  [(visible)]="isNamespaceContainerAssignmentModalShown"
>
  <lib-namespace-container-assignment 
  [selectedNamespaceId]="selectedNamespaceForContainerAssignment()?.id"
  (operationCanceled)="onNamespaceContainersAssignmentOperationCanceled()"
  (operationCompleted)="onNamespaceContainersAssignmentOperationCompleted()" />
</p-dialog>
