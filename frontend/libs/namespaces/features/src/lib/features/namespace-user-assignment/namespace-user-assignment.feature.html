<div
  class="w-[80vw] xl:w-4xl lg:w-3xl md:w-2xl sm:w-xl min-h-100 flex flex-col gap-4 p-2"
>
  <div class="w-full grow flex">
    <p-picklist
      [pt]="picklistPt"
      class="grow block"
      [source]="namespaceAssignUserStore.unassignedUsers()"
      [target]="namespaceAssignUserStore.assignedUsers()"
      [dragdrop]="true"
      [showSourceFilter]="shouldShowSourceFilter()"
      [showTargetFilter]="shouldShowTargetFilter()"
      [responsive]="true"
      breakpoint="1024px"
      filterBy="username"
      sourceFilterPlaceholder="Search by username"
      targetFilterPlaceholder="Search by username"
      dataKey="id"
      sourceHeader="Unassigned"
      targetHeader="Assigned"
      scrollHeight="15rem"
    >
      <ng-template #sourceHeader>
        <div class="font-semibold text-lg">Unassigned</div>
      </ng-template>

      <ng-template #targetHeader>
        <div class="font-semibold text-lg">Assigned</div>
      </ng-template>

      <ng-template let-item #item> {{item.username}} </ng-template>
    </p-picklist>
  </div>
  <div class="w-full flex flex-row justify-end gap-4">
    <p-button severity="danger" label="Cancel" (onClick)="onCancelBtnClick()" />
    <p-button
      severity="success"
      label="Confirm"
      (onClick)="onConfirmBtnClick()"
    />
  </div>
</div>
