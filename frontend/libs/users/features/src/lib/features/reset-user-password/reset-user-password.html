<p-stepper [value]="step()" [linear]="true" class="w-full">
  <p-step-list>
    <p-step [value]="ConfirmPasswordResetStepValue"
      >Confirm Password Reset</p-step
    >
    <p-step [value]="CopyTemporaryPasswordStepValue"
      >Copy Temporary Password</p-step
    >
  </p-step-list>

  <p-step-panels>
    <p-step-panel [value]="ConfirmPasswordResetStepValue">
      <ng-template #content>
        <div class="flex flex-col gap-8">
          <div>
            <p class="text-lg font-bold mb-2">Warning!</p>
            <p>
              This operation is <b>irreversible</b>, the user won't be able to
              log in with their previous password.
            </p>
            <p>
              After the user is reset they will be immediately logged out and
              will be prompted to change password the next time they log in.
            </p>
          </div>

          <div class="flex flex-row justify-between">
            <p-button
              severity="primary"
              label="Cancel"
              [disabled]="resetUserPasswordStore.resetStatus() !== 'idle'"
              (onClick)="onCancelBtnClick()"
            />

            <p-button
              severity="danger"
              label="Reset"
              [loading]="resetUserPasswordStore.resetStatus() === 'pending'"
              (onClick)="onResetPasswordBtnClick()"
            />
          </div>
        </div>
      </ng-template>
    </p-step-panel>

    <p-step-panel [value]="CopyTemporaryPasswordStepValue">
      <ng-template #content>
        <div class="flex flex-col gap-2">
          <lib-copy-text-field
            [password]="resetUserPasswordStore.generatedPassword()"
            (passwordCopied)="onPasswordCopied()"
          />

          <div class="flex flex-row justify-end">
            <p-button
              severity="primary"
              label="Close"
              [disabled]="!passwordCopied()"
              (onClick)="onConfirmBtnClick()"
            />
          </div>
        </div>
      </ng-template>
    </p-step-panel>
  </p-step-panels>
</p-stepper>
