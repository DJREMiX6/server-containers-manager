<p-card class="w-200 h-fit rounded-2xl overflow-hidden">
  <ng-template #header>
    <div class="w-full aspect-video flex flex-col gap-2 p-2">
      <div class="w-full grow flex flex-row gap-2">
        <div class="grow bg-surface-300 rounded-lg overflow-hidden">
          <p-skeleton width="100%" height="100%" />
        </div>
        <div class="grow bg-surface-300 rounded-lg overflow-hidden">
          <p-skeleton width="100%" height="100%" />
        </div>
      </div>
      <div class="w-full grow flex flex-row gap-2">
        <div class="grow bg-surface-300 rounded-lg overflow-hidden">
          <p-skeleton width="100%" height="100%" />
        </div>
        <div class="grow bg-surface-300 rounded-lg overflow-hidden">
          <p-skeleton width="100%" height="100%" />
        </div>
      </div>
    </div>
  </ng-template>
  <ng-template #title>{{ containerInfo().name }}</ng-template>
  <ng-template #subtitle>
    <div
      class="w-full overflow-x-auto flex flex-row align-middle items-start gap-2"
    >
      @for (namespace of containerInfo().namespaces; track namespace) {
        <p-tag [value]="namespace" />
      }
    </div>
  </ng-template>
  <ng-template #footer>
    <div class="flex justify-center align-middle items-center gap-4 mt-1">
      <p-button
        icon="pi pi-power-off"
        [disabled]="!showStartBtn() && !showStopBtn()"
        [severity]="showStopBtn() ? 'danger' : 'success'"
        (onClick)="startStopBtnClick.emit(this.containerInfo())"
      ></p-button>
      <p-button
        [icon]="playPauseBtnIcon()"
        [disabled]="!showPauseBtn() && !showResumePlayBtn()"
        [severity]="showResumePlayBtn() ? 'success' : 'warn'"
        (onClick)="playPauseBtnClick.emit(this.containerInfo())"
      ></p-button>
      <p-button
        icon="pi pi-replay"
        [disabled]="!showRestartBtn()"
        severity="info"
        (onClick)="restartBtnClick.emit(this.containerInfo())"
      ></p-button>
      <p-button
        icon="pi pi-stop"
        [disabled]="!showKillBtn()"
        severity="danger"
        (onClick)="killBtnClick.emit(this.containerInfo())"
      ></p-button>
    </div>
  </ng-template>
</p-card>
