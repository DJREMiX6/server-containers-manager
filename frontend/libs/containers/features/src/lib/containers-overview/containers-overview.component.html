<div class="flex flex-col h-full gap-4">
  <div
    class="grow flex flex-wrap flex-row align-middle items-center justify-center gap-4"
  >
    @for (container of containers; track container.info.id) {
      <lib-container-overview-card
        [containerInfo]="container.info"
        [containerResourcesData]="container.resourcesUsage"
        (startStopBtnClick)="startStopBtnClick_evt(container.info.id)"
        (playPauseBtnClick)="playPauseBtnClick_evt(container.info.id)"
        (restartBtnClick)="restartBtnClick_evt(container.info.id)"
        (killBtnClick)="killBtnClick_evt(container.info.id)"
      ></lib-container-overview-card>
    }
  </div>
</div>
